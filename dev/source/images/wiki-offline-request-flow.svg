<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="Lato, Helvetica, Arial, sans-serif" role="img"
     aria-labelledby="title desc">
  <title id="title">How a page request is answered</title>
  <desc id="desc">A page requests a URL. The service worker checks local
    storage first and returns the stored copy in about 15 milliseconds, then
    revalidates in the background. Only a request that is not held locally goes
    to the network, which takes about a second.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5058"/>
    </marker>
    <marker id="arrowFast" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e7a45"/>
    </marker>
    <marker id="arrowSlow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a5b1c"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#ffffff"/>

  <!-- the page -->
  <rect x="20" y="150" width="150" height="96" rx="5"
        fill="#f4f7fa" stroke="#2980b9" stroke-width="1.5"/>
  <text x="95" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2126">Wiki page</text>
  <text x="95" y="211" text-anchor="middle" font-size="12" fill="#4a5058">requests</text>
  <text x="95" y="229" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#4a5058">foo.html</text>

  <!-- interception -->
  <line x1="170" y1="198" x2="238" y2="198" stroke="#4a5058" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- service worker -->
  <rect x="240" y="138" width="176" height="120" rx="5"
        fill="#2980b9" stroke="#20618c" stroke-width="1.5"/>
  <text x="328" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Service worker</text>
  <text x="328" y="200" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#d6e8f5">sw.js</text>
  <text x="328" y="224" text-anchor="middle" font-size="12" fill="#d6e8f5">is this held</text>
  <text x="328" y="240" text-anchor="middle" font-size="12" fill="#d6e8f5">locally?</text>

  <!-- yes, to storage -->
  <path d="M 416 172 L 470 172 L 470 92 L 556 92" fill="none"
        stroke="#1e7a45" stroke-width="2" marker-end="url(#arrowFast)"/>
  <text x="486" y="80" font-size="12.5" font-weight="700" fill="#1e7a45">held</text>

  <!-- no, to network -->
  <path d="M 416 226 L 470 226 L 470 372 L 556 372" fill="none"
        stroke="#9a5b1c" stroke-width="2" marker-end="url(#arrowSlow)"/>
  <text x="486" y="392" font-size="12.5" font-weight="700" fill="#9a5b1c">not held</text>

  <!-- cache storage -->
  <rect x="558" y="30" width="300" height="182" rx="5"
        fill="#f2f8f4" stroke="#1e7a45" stroke-width="1.5"/>
  <text x="576" y="55" font-size="14.5" font-weight="700" fill="#14532d">Cache Storage</text>
  <text x="576" y="76" font-size="11.5" fill="#3c4a41">keyed by request URL</text>

  <text x="576" y="102" font-size="11.5" font-family="monospace" fill="#1d2126">ardupilot-pages-v3</text>
  <text x="576" y="120" font-size="11.5" font-family="monospace" fill="#1d2126">ardupilot-images-v3</text>
  <text x="576" y="138" font-size="11.5" font-family="monospace" fill="#1d2126">ardupilot-static-v3</text>
  <text x="576" y="156" font-size="11.5" font-family="monospace" fill="#1d2126">ardupilot-offline-&lt;wiki&gt;</text>
  <text x="576" y="174" font-size="11.5" font-family="monospace" fill="#1d2126">ardupilot-thirdparty-v3</text>
  <text x="576" y="196" font-size="11" fill="#5a6b60">downloaded wikis survive a version bump</text>

  <!-- network -->
  <rect x="558" y="330" width="300" height="84" rx="5"
        fill="#fdf6ee" stroke="#9a5b1c" stroke-width="1.5"/>
  <text x="576" y="356" font-size="14.5" font-weight="700" fill="#7a4614">Network</text>
  <text x="576" y="377" font-size="11.5" fill="#5c4a35">the origin server</text>
  <text x="576" y="399" font-size="11.5" fill="#5c4a35">unreachable when offline</text>

  <!-- timings -->
  <rect x="672" y="228" width="186" height="30" rx="4" fill="#e6f4ea" stroke="#1e7a45"/>
  <text x="765" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">13 to 19 ms</text>

  <rect x="672" y="424" width="186" height="30" rx="4" fill="#fbeee0" stroke="#9a5b1c"/>
  <text x="765" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4614">about 1,000 ms</text>

  <!-- background revalidation -->
  <path d="M 700 212 L 700 328" fill="none" stroke="#8b94a0"
        stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="712" y="264" font-size="11.5" fill="#5f6873">revalidated</text>
  <text x="712" y="280" font-size="11.5" fill="#5f6873">in the background;</text>
  <text x="712" y="296" font-size="11.5" fill="#5f6873">the page is told</text>
  <text x="712" y="312" font-size="11.5" fill="#5f6873">if it changed</text>

  <!-- returned to the page -->
  <path d="M 95 246 L 95 300 L 328 300 L 328 262" fill="none"
        stroke="#4a5058" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="150" y="317" font-size="11.5" fill="#4a5058">response returned to the page either way</text>
</svg>
