        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/offline-wiki.pebnum.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/offline-wiki.pebnum.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = offline-wiki.pebnum.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name offline-wiki.pebnum.com;
    return 404; # managed by Certbot


}