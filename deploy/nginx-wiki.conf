server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Production writes here: see update.sh, which passes
    # --destdir /var/sites/wiki/web to update.py.
    root /var/sites/wiki/web;
    index index.html;

    # THE RULE THAT MATTERS. Serve exactly what was asked for and never
    # canonicalise. /x.html must return 200, not a 301 to /x. The offline
    # archives store the paths Sphinx built, so the address a reader is on
    # and the key in Cache Storage have to be the same string. Measured on
    # ardupilot.org: /copter/docs/foo.html is 200, and the extensionless
    # form is a genuine 404.
    #
    # $uri/index.html rather than $uri/ is deliberate: the latter makes
    # nginx issue a 301 for directories, which is the same class of fault.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # The worker and the markup it drives are one unit. A cached worker
    # paired with fresh pages is unrecoverable without the kill switch.
    # This site's own scripts, which Sphinx does NOT fingerprint.
    #
    # Sphinx stamps its assets (theme.css?v=5d32c60e) so a stale copy is
    # impossible: the URL changes when the content does. Ours are served at a
    # fixed path, so without this a browser keeps an old copy for as long as it
    # likes. That cost a full session to diagnose once already: an update
    # shipped, the browser kept the previous script, and the feature failed in a
    # way that looked like a bug in code that was never running.
    location ~ ^/(js/pwa\.js|.*/_static/common_offline[^/]*\.(js|css))$ {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Offline archives, same origin as the pages so CORS never applies.
    # gzip_static serves rover-offline.tar.gz when rover-offline.tar is
    # requested, setting Content-Encoding: gzip. The browser then does the
    # decompression natively and the client needs no DecompressionStream.
    location /offline/ {
        gzip_static on;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
server {
    server_name offline-wiki.pebnum.com; # managed by Certbot

    # Production writes here: see update.sh, which passes
    # --destdir /var/sites/wiki/web to update.py.
    root /var/sites/wiki/web;
    index index.html;

    # THE RULE THAT MATTERS. Serve exactly what was asked for and never
