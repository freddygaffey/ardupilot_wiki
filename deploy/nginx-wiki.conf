server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Production writes here: see update.sh, which passes
    # --destdir /var/sites/wiki/web to update.py.
    root /var/sites/wiki/web;
    index index.html;

    # THE RULE THAT MATTERS. Serve exactly what was asked for and never
    # canonicalise. /x.html must return 200, not a 301 to /x. The offline
    # archives store the paths Sphinx built, so the address a reader is on
    # and the key in Cache Storage have to be the same string. Measured on
    # ardupilot.org: /copter/docs/foo.html is 200, and the extensionless
    # form is a genuine 404.
    #
    # $uri/index.html rather than $uri/ is deliberate: the latter makes
    # nginx issue a 301 for directories, which is the same class of fault.
    location / {
        # A directory asked for without its slash gets the slash, or every
        # relative link on the page it would serve resolves one level up.
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/ =404;
    }

    # The worker and the markup it drives are one unit. A cached worker
    # paired with fresh pages is unrecoverable without the kill switch.
    # This site's own scripts, which Sphinx does NOT fingerprint.
    #
    # Sphinx stamps its assets (theme.css?v=5d32c60e) so a stale copy is
    # impossible: the URL changes when the content does. Ours are served at a
    # fixed path, so without this a browser keeps an old copy for as long as it
    # likes. That cost a full session to diagnose once already: an update
    # shipped, the browser kept the previous script, and the feature failed in a
    # way that looked like a bug in code that was never running.
    location ~ ^/(js/pwa\.js|.*/_static/common_offline[^/]*\.(js|css))$ {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Sphinx fingerprints its theme assets (theme.css?v=5d32c60e), so a changed
    # file always arrives under a new URL and a cached copy can never be stale.
    # With no Cache-Control at all the browser still revalidates each one on
    # every page - roughly two dozen conditional round-trips, since the HTML
    # carries no freshness either - which is most of what made a fresh page feel
    # slower than it should. A short cache lets the browser reuse them without
    # asking. Two days rather than immutable on purpose: a couple of theme files
    # are referenced without the ?v= stamp, so a permanent pin could strand a
    # real change. The site's own unfingerprinted scripts match the no-cache
    # rule above, which wins by being an earlier regex, so they are unaffected.
    location ~ /_static/.*\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        add_header Cache-Control "public, max-age=172800";
    }

    # Offline artifacts, same origin as the pages so CORS never applies.
    # gzip_static serves rover-offline.tar.gz when rover-offline.tar is
    # requested, setting Content-Encoding: gzip. The browser then does the
    # decompression natively and the client needs no DecompressionStream.
    #
    # The manifest and the per-file hash tables are the freshness oracle: they
    # are how a saved wiki learns a new build exists. They MUST NOT be pinned.
    # Served immutable for a year (as everything under /offline/ was), a reader
    # who opened the offline page once would keep that manifest for a year, with
    # revalidation suppressed, and never see another build. The client asks for
    # them no-cache regardless, but the server must not contradict that: one
    # forgotten flag on the client and the reader is stuck for twelve months.
    location = /offline/offline-manifest.json {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/offline/[^/]+-files\.json$ {
        add_header Cache-Control "no-cache";
    }

    # The archives themselves change content under a stable filename per build,
    # so they carry the build id as a ?v= query from the manifest and are safe
    # to cache hard. immutable is correct here and only here.
    location /offline/ {
        gzip_static on;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
